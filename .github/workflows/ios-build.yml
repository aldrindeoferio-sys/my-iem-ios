name: iOS Build
on:
  push:
    branches: [ main ]
  workflow_dispatch:
jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        run: xcodegen generate
      - name: Build simulator
        run: xcodebuild -project MYIEM.xcodeproj -scheme MYIEM -sdk iphonesimulator -configuration Debug CODE_SIGNING_ALLOWED=NO build
